<script>

    root.innerHTML =
      '<div style="font-family:monospace;padding:20px;color:#8A4A16;background:#F4E3D3;">' +
      "Still loading after 5 seconds — likely the React/Babel scripts from unpkg.com didn't load. " +
      "Check your internet connection, or whether an ad blocker / firewall is blocking unpkg.com." +

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;

// ════════════════════════════════════════════════════════════════
// CONFIGURE — paste your Apps Script URL + token between the quotes
// ════════════════════════════════════════════════════════════════
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzHpWKcsT9w01rxs4wzrtfI-G2dbrp6LsPkX3x_W2KR8AyLFVsaszQBwUh6f4l01wr74g/exec";
const APP_TOKEN = "pWojP7euA3jW-E8XNYYr4TQZDPFfJxnh";
// ════════════════════════════════════════════════════════════════

function configured() {
  return APPS_SCRIPT_URL !== "YOUR_SCRIPT_URL_HERE";
}

// ── Helpers ──────────────────────────────────────────────────────
function slugify(address) {
  return address.toLowerCase().trim().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
}
function newId() { return Math.random().toString(36).slice(2, 10); }

// Google Sheets sometimes silently converts a plain "YYYY-MM-DD" string into
// its own Date type, which then comes back from the backend as a full
// timestamp like "2026-08-20T00:00:00.000Z" instead of a plain date string.
// Always take just the first 10 chars (the actual date part) so parsing
// works regardless of which form we get back.
function parseLocalDate(d) {
  if (!d) return null;
  const datePart = String(d).slice(0, 10);
  const parsed = new Date(datePart + "T00:00:00");
  return isNaN(parsed.getTime()) ? null : parsed;
}

function fmtDate(d) {
  const parsed = parseLocalDate(d);
  return parsed ? parsed.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" }) : "";
}

// Walk back N *working* days (Mon-Fri) from a date, skipping weekends.
function workingDaysBefore(dateStr, n) {
  let d = parseLocalDate(dateStr);
  if (!d) return null;
  let remaining = n;
  while (remaining > 0) {
    d.setDate(d.getDate() - 1);
    const day = d.getDay(); // 0 = Sun, 6 = Sat
    if (day !== 0 && day !== 6) remaining--;
  }
  return d.toISOString().slice(0, 10);
}

async function withRetry(fn, attempts = 3, delayMs = 400) {
  let lastErr;
  for (let i = 0; i < attempts; i++) {
    try { return await fn(); }
    catch (e) { lastErr = e; if (i < attempts - 1) await new Promise(r => setTimeout(r, delayMs * (i + 1))); }
  }
  throw lastErr;
}

async function backendGet(params) {
  const url = new URL(APPS_SCRIPT_URL);
  Object.entries({ token: APP_TOKEN, ...params }).forEach(([k, v]) => url.searchParams.set(k, v));
  const res = await fetch(url.toString());
  const data = await res.json();
  if (data.error) throw new Error(data.error);
  return data;
}
async function backendPost(action, payload) {
  const res = await fetch(APPS_SCRIPT_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ action, token: APP_TOKEN, ...payload }),
  });
  const data = await res.json();
  if (data.error) throw new Error(data.error);
  return data;
}

// ── Icons (minimal) ─────────────────────────────────────────────
function Icon({ size = 16, strokeWidth = 2, style, children }) {
  return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" style={style}>{children}</svg>;
}
const ArrowLeft = p => <Icon {...p}><line x1="19" y1="12" x2="5" y2="12" /><polyline points="12 19 5 12 12 5" /></Icon>;
const Trash2 = p => <Icon {...p}><polyline points="3 6 5 6 21 6" /><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" /><path d="M10 11v6" /><path d="M14 11v6" /><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2" /></Icon>;
const Send = p => <Icon {...p}><line x1="22" y1="2" x2="11" y2="13" /><polygon points="22 2 15 22 11 13 2 9 22 2" /></Icon>;
const AlertTriangle = p => <Icon {...p}><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z" /><line x1="12" y1="9" x2="12" y2="13" /><line x1="12" y1="17" x2="12.01" y2="17" /></Icon>;
const CheckCircle2 = p => <Icon {...p}><path d="M21.8 10A10 10 0 1 1 17 3.3" /><polyline points="22 4 12 14.01 9 11.01" /></Icon>;

// ── App shell ────────────────────────────────────────────────────
function App() {
  const [screen, setScreen] = useState("list"); // list | job | report
  const [jobs, setJobs] = useState([]);
  const [loadingJobs, setLoadingJobs] = useState(true);
  const [activeSlug, setActiveSlug] = useState(null);
  const [activeJob, setActiveJob] = useState(null);
  const [jobLoading, setJobLoading] = useState(false);
  const [error, setError] = useState(null);
  const [reportAssignee, setReportAssignee] = useState(null);

  useEffect(() => {
    (async () => {
      if (!configured()) { setLoadingJobs(false); return; }
      try {
        const result = await withRetry(() => backendGet({ action: "listJobs" }));
        setJobs(result || []);
      } catch (e) { setJobs([]); }
      finally { setLoadingJobs(false); }
    })();
  }, []);

  const loadJob = async (slug) => {
    setJobLoading(true);
    setError(null);
    try {
      const result = await withRetry(() => backendGet({ action: "getJob", slug }));
      setActiveJob(result);
    } catch (e) { setError("Couldn't load this job (" + e.message + ")."); }
    finally { setJobLoading(false); }
  };

  const openJob = async (slug) => {
    setActiveSlug(slug);
    setScreen("job");
    setError(null);
    await loadJob(slug);
  };

  // Deep-link support: ?job=<slug> in the URL (set by the Portfolio
  // Dashboard) opens that house's walkthrough directly instead of starting
  // on the job list. Purely additive — normal navigation here is
  // unaffected when the parameter is absent.
  useEffect(() => {
    const params = new URLSearchParams(window.location.search);
    const slug = params.get("job");
    if (slug) openJob(slug);
  }, []);

  const createJob = async (address, closingDate) => {
    const slug = slugify(address) + "-" + newId().slice(0, 4);
    const job = { slug, address: address.trim(), closingDate: closingDate || "", createdAt: new Date().toISOString(), lastUpdated: new Date().toISOString() };
    try { await withRetry(() => backendPost("createJob", { job })); }
    catch (e) { setError("Couldn't create job."); return; }
    setJobs([{ ...job }, ...jobs]);
    await openJob(slug);
  };

  const deleteJob = async (slug, e) => {
    e.stopPropagation();
    if (!window.confirm("Delete this house's walkthrough data? This can't be undone.")) return;
    try {
      await withRetry(() => backendPost("deleteJob", { slug }));
      setJobs(jobs.filter(j => j.slug !== slug));
    } catch (e) { setError("Couldn't delete job."); }
  };

  const refreshActiveJob = async () => { if (activeSlug) await loadJob(activeSlug); };

  // Updates the active job's items in place, no network round-trip — used right
  // after a write we already know succeeded, so the screen updates instantly.
  const markSentLocally = (assignee) => {
    setActiveJob(prev => {
      if (!prev) return prev;
      const now = new Date().toISOString();
      return {
        ...prev,
        items: prev.items.map(it =>
          it.assignee === assignee && it.status === "assignable"
            ? { ...it, status: "sent", dateSent: now }
            : it
        ),
      };
    });
  };

  const openReport = (assignee) => { setReportAssignee(assignee); setScreen("report"); };

  return (
    <div style={S.app}>
      <div style={S.body}>
        {!configured() && (
          <div style={S.banner}>
            ⚙ Open <strong>index.html</strong> and replace <code>YOUR_SCRIPT_URL_HERE</code> / <code>YOUR_APP_TOKEN_HERE</code> with your Apps Script deployment URL and token to enable syncing.
          </div>
        )}
        {error && <div style={S.errBanner}>{error}</div>}

        {screen === "list" && (
          <JobList jobs={jobs} loading={loadingJobs} onOpen={openJob} onCreate={createJob} onDelete={deleteJob} />
        )}
        {screen === "job" && (
          jobLoading || !activeJob
            ? <div style={S.loading}>LOADING…</div>
            : <JobScreen
                job={activeJob}
                onBack={() => { setScreen("list"); setActiveJob(null); }}
                onRefresh={refreshActiveJob}
                onOpenReport={openReport}
                setError={setError}
              />
        )}
        {screen === "report" && activeJob && (
          <ReportScreen job={activeJob} assignee={reportAssignee} onBack={() => setScreen("job")} onShipped={() => markSentLocally(reportAssignee)} setError={setError} />
        )}
      </div>
    </div>
  );
}

// ── Job list ─────────────────────────────────────────────────────
function JobList({ jobs, loading, onOpen, onCreate, onDelete }) {
  const [showAdd, setShowAdd] = useState(false);
  const [addr, setAddr] = useState("");
  const [closing, setClosing] = useState("");

  const go = () => { if (addr.trim()) { onCreate(addr, closing); setAddr(""); setClosing(""); setShowAdd(false); } };

  return (
    <div>
      <div style={S.ph}>
        <h1 style={S.pt}>Walkthrough Tracker <span style={S.dc}>{jobs.length}</span></h1>
        <button style={S.pBtn} onClick={() => setShowAdd(true)}>+ NEW HOUSE</button>
      </div>
      {loading && <div style={S.loading}>LOADING…</div>}
      {!loading && jobs.length === 0 && <Empty icon="🚶" text="No houses yet. Tap + NEW HOUSE to start a walkthrough." />}
      <div style={S.stack}>
        {jobs.map(j => (
          <div key={j.slug} style={S.card} onClick={() => onOpen(j.slug)}>
            <div style={S.cardRow}>
              <div style={{ flex: 1 }}>
                <div style={S.addr}>{j.address}</div>
                {j.closingDate && <div style={S.metaTxt}>Closing {fmtDate(j.closingDate)}</div>}
              </div>
              <button style={S.iconBtn} onClick={(e) => onDelete(j.slug, e)}><Trash2 size={14} /></button>
            </div>
          </div>
        ))}
      </div>
      {showAdd && (
        <Overlay title="New House">
          <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
            <div>
              <label style={S.fLbl}>ADDRESS</label>
              <input style={S.tIn} placeholder="Street address…" value={addr} onChange={e => setAddr(e.target.value)} autoFocus />
            </div>
            <div>
              <label style={S.fLbl}>CLOSING DATE (optional — can also be dictated)</label>
              <input type="date" style={S.tIn} value={closing} onChange={e => setClosing(e.target.value)} />
            </div>
          </div>
          <div style={{ ...S.mBtns, marginTop: 20 }}>
            <button style={S.gBtn} onClick={() => setShowAdd(false)}>CANCEL</button>
            <button style={{ ...S.pBtn, opacity: addr.trim() ? 1 : 0.4 }} onClick={go}>CREATE</button>
          </div>
        </Overlay>
      )}
    </div>
  );
}

// ── Job screen: dictate, review, ship ─────────────────────────────
function JobScreen({ job, onBack, onRefresh, onOpenReport, setError }) {
  const [dictation, setDictation] = useState("");
  const [processing, setProcessing] = useState(false);
  const [pendingItems, setPendingItems] = useState(null); // null = not reviewing; array = reviewing
  const [pendingClosingDate, setPendingClosingDate] = useState(null);
  const [confirmDictation, setConfirmDictation] = useState("");
  const [confirmProcessing, setConfirmProcessing] = useState(false);
  const [pendingConfirmations, setPendingConfirmations] = useState(null); // { matches, unmatched } while reviewing
  const [expandedAssignee, setExpandedAssignee] = useState(null);

  const items = job.items || [];
  const openItems = items.filter(it => it.status === "assignable" || it.status === "sent");
  const flagged = items.filter(it => it.status === "flagged");
  const selfAssignedOpen = items.filter(it => it.status === "self_assigned");
  const completed = items.filter(it => it.status === "completed");

  const byAssignee = {};
  openItems.forEach(it => { (byAssignee[it.assignee] = byAssignee[it.assignee] || []).push(it); });

  const processDictation = async () => {
    if (!dictation.trim()) return;
    setProcessing(true);
    setError(null);
    try {
      const result = await withRetry(() => backendPost("parseDictation", { dictation }));
      setPendingItems(result.items || []);
      setPendingClosingDate(result.closingDate || null);
    } catch (e) {
      setError("Couldn't process dictation (" + e.message + ").");
    } finally {
      setProcessing(false);
    }
  };

  const updatePendingItem = (id, field, value) => {
    setPendingItems(prev => prev.map(it => it.id === id ? { ...it, [field]: value } : it));
  };
  const removePendingItem = (id) => setPendingItems(prev => prev.filter(it => it.id !== id));

  const confirmAndSave = async () => {
    setProcessing(true);
    setError(null);
    try {
      const merged = items.concat(pendingItems);
      await withRetry(() => backendPost("saveItems", { slug: job.slug, items: merged }));
      if (pendingClosingDate && !job.closingDate) {
        await withRetry(() => backendPost("saveJob", { job: { ...job, closingDate: pendingClosingDate } }));
      }
      setPendingItems(null);
      setPendingClosingDate(null);
      setDictation("");
      await onRefresh();
    } catch (e) {
      setError("Couldn't save items (" + e.message + ").");
    } finally {
      setProcessing(false);
    }
  };

  const resolveFlaggedItem = async (item, newAssignee) => {
    setError(null);
    try {
      await withRetry(() => backendPost("resolveFlag", { itemId: item.id, resolution: { newAssignee, newStatus: "assignable" } }));
      await onRefresh();
    } catch (e) { setError("Couldn't resolve item (" + e.message + ")."); }
  };

  const reopenItem = async (item) => {
    setError(null);
    try {
      await withRetry(() => backendPost("updateItem", { item: { id: item.id, status: "assignable", dateCompleted: "" } }));
      await onRefresh();
    } catch (e) { setError("Couldn't reopen item (" + e.message + ")."); }
  };

  const saveItemEdit = async (item) => {
    setError(null);
    try {
      await withRetry(() => backendPost("updateItem", { item }));
      await onRefresh();
    } catch (e) { setError("Couldn't save edit (" + e.message + ")."); }
  };

  const markComplete = async (item) => {
    setError(null);
    try {
      await withRetry(() => backendPost("updateItem", { item: { id: item.id, status: "completed", dateCompleted: new Date().toISOString() } }));
      await onRefresh();
    } catch (e) { setError("Couldn't mark complete (" + e.message + ")."); }
  };

  const processConfirmation = async () => {
    if (!confirmDictation.trim()) return;
    setConfirmProcessing(true);
    setError(null);
    try {
      const openItemsForMatch = openItems.map(it => ({ id: it.id, room: it.room, item: it.item }));
      const result = await withRetry(() => backendPost("parseConfirmation", { dictation: confirmDictation, openItems: openItemsForMatch }));
      setPendingConfirmations(result);
    } catch (e) {
      setError("Couldn't process confirmation (" + e.message + ").");
    } finally {
      setConfirmProcessing(false);
    }
  };

  const updatePendingMatch = (id, field, value) => {
    setPendingConfirmations(prev => ({ ...prev, matches: prev.matches.map(m => m.id === id ? { ...m, [field]: value } : m) }));
  };
  const removePendingMatch = (id) => {
    setPendingConfirmations(prev => ({ ...prev, matches: prev.matches.filter(m => m.id !== id) }));
  };

  const applyConfirmations = async () => {
    setConfirmProcessing(true);
    setError(null);
    try {
      await withRetry(() => backendPost("applyConfirmations", { matches: pendingConfirmations.matches }));
      setPendingConfirmations(null);
      setConfirmDictation("");
      await onRefresh();
    } catch (e) {
      setError("Couldn't apply confirmations (" + e.message + ").");
    } finally {
      setConfirmProcessing(false);
    }
  };

  return (
    <div>
      <div style={S.ph}>
        <button style={S.gBtn} onClick={onBack}><ArrowLeft size={12} /> BACK</button>
      </div>
      <div style={S.dAddr}>{job.address}</div>
      {job.closingDate && <div style={S.metaTxt}>Closing {fmtDate(job.closingDate)}</div>}

      <div style={S.div} />

      {pendingItems === null && pendingConfirmations === null ? (
        <>
          <div style={S.secLbl}>DICTATE WALKTHROUGH</div>
          <textarea
            style={S.dictateArea}
            rows={6}
            placeholder="Use your phone's mic-to-text, then paste or dictate directly here. Mention the closing date first if not already set, then room, item, assignee for each thing you find…"
            value={dictation}
            onChange={e => setDictation(e.target.value)}
          />
          <button style={{ ...S.pBtn, width: "100%", marginTop: 10, opacity: dictation.trim() && !processing ? 1 : 0.4 }} onClick={processDictation} disabled={!dictation.trim() || processing}>
            {processing ? "PROCESSING…" : "PROCESS DICTATION"}
          </button>

          <div style={S.div} />

          <div style={S.secLbl}>CONFIRM PASS (revisit updates)</div>
          <textarea
            style={S.dictateArea}
            rows={4}
            placeholder="Dictate what you found on a revisit — what's done, what's still pending with any new context…"
            value={confirmDictation}
            onChange={e => setConfirmDictation(e.target.value)}
          />
          <button style={{ ...S.gBtn, width: "100%", marginTop: 10, justifyContent: "center", opacity: confirmDictation.trim() && !confirmProcessing ? 1 : 0.4 }} onClick={processConfirmation} disabled={!confirmDictation.trim() || confirmProcessing}>
            {confirmProcessing ? "PROCESSING…" : "PROCESS CONFIRMATION"}
          </button>

          <div style={S.div} />

          {flagged.length > 0 && (
            <>
              <div style={S.secLbl}><AlertTriangle size={11} style={{ marginRight: 4, verticalAlign: -1 }} />NEEDS MY FOLLOW-UP ({flagged.length})</div>
              <div style={{ ...S.stack, marginBottom: 24 }}>
                {flagged.map(it => <FlaggedRow key={it.id} item={it} onResolve={resolveFlaggedItem} />)}
              </div>
            </>
          )}

          {selfAssignedOpen.length > 0 && (
            <>
              <div style={S.secLbl}>INTERNAL FOLLOW-UP (CHRIS — NO EMAIL NEEDED)</div>
              <div style={{ ...S.stack, marginBottom: 24 }}>
                {selfAssignedOpen.map(it => (
                  <ItemRow key={it.id} item={it} onSave={saveItemEdit} onComplete={markComplete} showAssignee={false} />
                ))}
              </div>
            </>
          )}

          <div style={S.secLbl}>OPEN ITEMS ({Object.keys(byAssignee).length} assignee{Object.keys(byAssignee).length !== 1 ? "s" : ""})</div>
          {Object.keys(byAssignee).length === 0 && <Empty icon="📋" text="No open items yet. Dictate a walkthrough above." />}
          <div style={S.stack}>
            {Object.entries(byAssignee).map(([assignee, its]) => {
              const allSent = its.every(it => it.status === "sent");
              const expanded = expandedAssignee === assignee;
              return (
                <div key={assignee} style={S.card}>
                  <div style={S.cardRow} onClick={() => setExpandedAssignee(expanded ? null : assignee)}>
                    <div style={{ flex: 1, cursor: "pointer" }}>
                      <div style={S.addr}>{assignee}</div>
                      <div style={S.metaTxt}>{its.length} item{its.length > 1 ? "s" : ""}</div>
                    </div>
                    {allSent ? <span style={{ color: "#4ade80", fontSize: 11 }}><CheckCircle2 size={14} /></span> : <Badge color="amber">PENDING</Badge>}
                  </div>
                  {expanded && (
                    <div style={{ marginTop: 12, display: "flex", flexDirection: "column", gap: 8 }}>
                      {its.map(it => <ItemRow key={it.id} item={it} onSave={saveItemEdit} onComplete={markComplete} showAssignee={true} />)}
                      <button style={{ ...S.gBtn, justifyContent: "center" }} onClick={() => onOpenReport(assignee)}>VIEW REPORT →</button>
                    </div>
                  )}
                </div>
              );
            })}
          </div>

          {completed.length > 0 && (
            <>
              <div style={{ ...S.secLbl, marginTop: 24 }}>COMPLETED ({completed.length})</div>
              <div style={S.stack}>
                {completed.map(it => <CompletedItemRow key={it.id} item={it} onSave={saveItemEdit} onReopen={reopenItem} />)}
              </div>
            </>
          )}
        </>
      ) : pendingConfirmations !== null ? (
        <ReviewConfirmations
          confirmations={pendingConfirmations}
          openItems={openItems}
          onUpdate={updatePendingMatch}
          onRemove={removePendingMatch}
          onApply={applyConfirmations}
          onCancel={() => { setPendingConfirmations(null); }}
          processing={confirmProcessing}
        />
      ) : (
        <ReviewPending
          items={pendingItems}
          closingDate={pendingClosingDate}
          onUpdate={updatePendingItem}
          onRemove={removePendingItem}
          onConfirm={confirmAndSave}
          onCancel={() => { setPendingItems(null); setPendingClosingDate(null); }}
          processing={processing}
        />
      )}
    </div>
  );
}

function ItemRow({ item, onSave, onComplete, showAssignee }) {
  const [editing, setEditing] = useState(false);
  const [room, setRoom] = useState(item.room);
  const [text, setText] = useState(item.item);
  const [assignee, setAssignee] = useState(item.assignee);

  const save = () => { onSave({ ...item, room, item: text, assignee }); setEditing(false); };
  const cancel = () => { setRoom(item.room); setText(item.item); setAssignee(item.assignee); setEditing(false); };

  if (editing) {
    return (
      <div style={S.reviewRow}>
        <input style={{ ...S.tIn, marginBottom: 6, width: "100%" }} value={room} onChange={e => setRoom(e.target.value)} placeholder="Room" />
        <input style={{ ...S.tIn, marginBottom: 6, width: "100%" }} value={text} onChange={e => setText(e.target.value)} placeholder="Item" />
        {showAssignee && <input style={{ ...S.tIn, marginBottom: 8, width: "100%" }} value={assignee} onChange={e => setAssignee(e.target.value)} placeholder="Assignee" />}
        <div style={{ display: "flex", gap: 6 }}>
          <button style={S.gBtn} onClick={cancel}>CANCEL</button>
          <button style={S.pBtn} onClick={save}>SAVE</button>
        </div>
      </div>
    );
  }

  return (
    <div style={S.itemRow}>
      <div style={S.itemText}>{item.room}: {item.item}</div>
      {item.notes && <div style={{ ...S.metaTxt, fontStyle: "italic" }}>{item.notes}</div>}
      <div style={{ display: "flex", gap: 6, marginTop: 8 }}>
        <button style={S.gBtn} onClick={() => setEditing(true)}>EDIT</button>
        <button style={{ ...S.gBtn, color: "#4ade80", borderColor: "rgba(34,197,94,0.35)" }} onClick={() => onComplete(item)}><CheckCircle2 size={12} /> COMPLETE</button>
      </div>
    </div>
  );
}

function CompletedItemRow({ item, onSave, onReopen }) {
  const [editing, setEditing] = useState(false);
  const [room, setRoom] = useState(item.room);
  const [text, setText] = useState(item.item);
  const [assignee, setAssignee] = useState(item.assignee);

  const save = () => { onSave({ ...item, room, item: text, assignee }); setEditing(false); };
  const cancel = () => { setRoom(item.room); setText(item.item); setAssignee(item.assignee); setEditing(false); };

  if (editing) {
    return (
      <div style={S.reviewRow}>
        <input style={{ ...S.tIn, marginBottom: 6, width: "100%" }} value={room} onChange={e => setRoom(e.target.value)} placeholder="Room" />
        <input style={{ ...S.tIn, marginBottom: 6, width: "100%" }} value={text} onChange={e => setText(e.target.value)} placeholder="Item" />
        <input style={{ ...S.tIn, marginBottom: 8, width: "100%" }} value={assignee} onChange={e => setAssignee(e.target.value)} placeholder="Assignee" />
        <div style={{ display: "flex", gap: 6 }}>
          <button style={S.gBtn} onClick={cancel}>CANCEL</button>
          <button style={S.pBtn} onClick={save}>SAVE</button>
        </div>
      </div>
    );
  }

  return (
    <div style={{ ...S.itemRow, opacity: 0.75 }}>
      <div style={S.itemText}>{item.room}: {item.item} <span style={{ color: "#6b7280" }}>· {item.assignee}</span></div>
      {item.dateCompleted && <div style={{ ...S.metaTxt, color: "#4ade80" }}>Verified complete {fmtDate(item.dateCompleted)}</div>}
      <div style={{ display: "flex", gap: 6, marginTop: 8 }}>
        <button style={S.gBtn} onClick={() => setEditing(true)}>EDIT</button>
        <button style={S.gBtn} onClick={() => onReopen(item)}>REOPEN</button>
      </div>
    </div>
  );
}

function ReviewConfirmations({ confirmations, openItems, onUpdate, onRemove, onApply, onCancel, processing }) {
  const itemById = {};
  openItems.forEach(it => { itemById[it.id] = it; });
  return (
    <div>
      <div style={S.secLbl}>REVIEW CONFIRMATION MATCHES</div>
      <div style={{ ...S.stack, marginBottom: 16 }}>
        {confirmations.matches.map(m => {
          const it = itemById[m.id];
          return (
            <div key={m.id} style={S.reviewRow}>
              <div style={S.itemText}>{it ? `${it.room}: ${it.item}` : m.id}</div>
              <div style={{ display: "flex", gap: 6, margin: "8px 0 6px" }}>
                <select style={S.tIn} value={m.action} onChange={e => onUpdate(m.id, "action", e.target.value)}>
                  <option value="complete">Mark Complete</option>
                  <option value="note">Add Note Only</option>
                </select>
                <button style={S.iconBtn} onClick={() => onRemove(m.id)}><Trash2 size={13} /></button>
              </div>
              <input style={{ ...S.tIn, width: "100%" }} value={m.note || ""} onChange={e => onUpdate(m.id, "note", e.target.value)} placeholder="Note (optional)" />
            </div>
          );
        })}
        {confirmations.matches.length === 0 && <div style={S.metaTxt}>No confident matches found.</div>}
      </div>
      {confirmations.unmatched && confirmations.unmatched.length > 0 && (
        <>
          <div style={S.secLbl}>COULDN'T CONFIDENTLY MATCH</div>
          <div style={{ ...S.stack, marginBottom: 16 }}>
            {confirmations.unmatched.map((u, i) => (
              <div key={i} style={{ ...S.itemRow, borderColor: "rgba(245,158,11,0.3)" }}>
                <div style={S.itemText}>{u}</div>
              </div>
            ))}
          </div>
        </>
      )}
      <div style={S.mBtns}>
        <button style={S.gBtn} onClick={onCancel}>CANCEL</button>
        <button style={{ ...S.pBtn, opacity: processing ? 0.5 : 1 }} onClick={onApply} disabled={processing || confirmations.matches.length === 0}>{processing ? "APPLYING…" : "APPLY"}</button>
      </div>
    </div>
  );
}

function FlaggedRow({ item, onResolve }) {
  const [reassign, setReassign] = useState("");
  return (
    <div style={{ ...S.itemRow, borderColor: "rgba(245,158,11,0.3)", backgroundColor: "rgba(245,158,11,0.05)" }}>
      <div style={S.itemText}>{item.room}: {item.item}</div>
      <div style={S.metaTxt}>Currently: {item.assignee}</div>
      <div style={{ display: "flex", gap: 6, marginTop: 8 }}>
        <input style={{ ...S.tIn, flex: 1 }} placeholder="Reassign to…" value={reassign} onChange={e => setReassign(e.target.value)} />
        <button style={S.gBtn} disabled={!reassign.trim()} onClick={() => onResolve(item, reassign.trim())}>RESOLVE</button>
      </div>
    </div>
  );
}

function ReviewPending({ items, closingDate, onUpdate, onRemove, onConfirm, onCancel, processing }) {
  return (
    <div>
      <div style={S.secLbl}>REVIEW BEFORE SAVING</div>
      {closingDate && <div style={{ ...S.metaTxt, marginBottom: 12 }}>Detected closing date: {fmtDate(closingDate)}</div>}
      <div style={{ ...S.stack, marginBottom: 20 }}>
        {items.map(it => (
          <div key={it.id} style={S.reviewRow}>
            <div style={{ display: "flex", gap: 6, marginBottom: 6 }}>
              <input style={{ ...S.tIn, flex: 1 }} value={it.room} onChange={e => onUpdate(it.id, "room", e.target.value)} placeholder="Room" />
              <button style={S.iconBtn} onClick={() => onRemove(it.id)}><Trash2 size={13} /></button>
            </div>
            <input style={{ ...S.tIn, width: "100%", marginBottom: 6 }} value={it.item} onChange={e => onUpdate(it.id, "item", e.target.value)} placeholder="Item" />
            <div style={{ display: "flex", gap: 6 }}>
              <input style={{ ...S.tIn, flex: 1 }} value={it.assignee} onChange={e => onUpdate(it.id, "assignee", e.target.value)} placeholder="Assignee" />
              <select style={S.tIn} value={it.status} onChange={e => onUpdate(it.id, "status", e.target.value)}>
                <option value="assignable">Assignable</option>
                <option value="flagged">Flagged</option>
                <option value="self_assigned">Self (Chris)</option>
              </select>
            </div>
          </div>
        ))}
      </div>
      <div style={S.mBtns}>
        <button style={S.gBtn} onClick={onCancel}>CANCEL</button>
        <button style={{ ...S.pBtn, opacity: processing ? 0.5 : 1 }} onClick={onConfirm} disabled={processing}>{processing ? "SAVING…" : "SAVE ITEMS"}</button>
      </div>
    </div>
  );
}

// ── Report screen ────────────────────────────────────────────────
function ReportScreen({ job, assignee, onBack, onShipped, setError }) {
  const [shipping, setShipping] = useState(false);
  const [copied, setCopied] = useState(false);
  const items = (job.items || []).filter(it => it.assignee === assignee);
  const deadline = job.closingDate ? workingDaysBefore(job.closingDate, 2) : null;
  const allSent = items.length > 0 && items.every(it => it.status === "sent");

  const reportText = [
    `Good morning. Can you please have the below listed items completed at the above address${deadline ? ` prior to ${fmtDate(deadline)}` : ""}.`,
    "",
    ...items.map(it => `• ${it.room}: ${it.item}`),
  ].join("\n");

  const copyReport = () => {
    navigator.clipboard.writeText(reportText);
    setCopied(true);
    setTimeout(() => setCopied(false), 1800);
  };

  const ship = async () => {
    setShipping(true);
    setError(null);
    try {
      await withRetry(() => backendPost("shipReport", { slug: job.slug, assignee }));
      onShipped();
    } catch (e) { setError("Couldn't mark report as sent (" + e.message + ")."); }
    finally { setShipping(false); }
  };

  return (
    <div>
      <div style={S.ph}>
        <button style={S.gBtn} onClick={onBack}><ArrowLeft size={12} /> BACK</button>
        <button style={S.gBtn} onClick={copyReport}>{copied ? "✓ COPIED" : "COPY"}</button>
      </div>
      <div style={S.dAddr}>{assignee}</div>
      <div style={S.metaTxt}>{job.address}{deadline ? ` · Due ${fmtDate(deadline)}` : ""}</div>

      <div style={S.div} />

      <div style={S.reportBox}>
        <pre style={S.reportPre}>{reportText}</pre>
      </div>

      <div style={{ marginTop: 20 }}>
        {allSent ? (
          <div style={{ ...S.metaTxt, color: "#4ade80" }}><CheckCircle2 size={13} style={{ marginRight: 4, verticalAlign: -2 }} />Sent</div>
        ) : (
          <button style={{ ...S.pBtn, width: "100%", opacity: shipping ? 0.5 : 1 }} onClick={ship} disabled={shipping}>
            <Send size={13} style={{ marginRight: 6, verticalAlign: -2 }} />{shipping ? "MARKING SENT…" : "MARK AS SENT"}
          </button>
        )}
      </div>
    </div>
  );
}

  const c = {
    amber: { bg: "rgba(245,158,11,0.12)", t: "#fbbf24", b: "rgba(245,158,11,0.25)" },
    green: { bg: "rgba(34,197,94,0.12)", t: "#4ade80", b: "rgba(34,197,94,0.25)" },
  }[color] || { bg: "rgba(92,122,153,0.15)", t: "#5c7a99", b: "rgba(92,122,153,0.3)" };
  return <span style={{ fontSize: 9, fontWeight: 700, letterSpacing: "0.08em", padding: "2px 7px", borderRadius: 3, backgroundColor: c.bg, color: c.t, border: `1px solid ${c.b}` }}>{children}</span>;
}
